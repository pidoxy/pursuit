name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: End-to-end smoke test
        run: |
          npx playwright install --with-deps chromium
          npm i --no-save playwright
          DATA_DIR=$RUNNER_TEMP/data INBOUND_SECRET=testsecret INBOUND_DOMAIN=in.pursuit.test APP_URL=http://localhost:3000 APP_SECRET=ci-secret-1234567890 npm start &
          npx wait-on http://localhost:3000/api/health
          INBOUND_SECRET=testsecret node scripts/e2e.mjs

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t pursuit .
