services:
  - type: web
    name: pursuit
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: pursuit-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: APP_URL
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: INBOUND_DOMAIN
        sync: false
      - key: INBOUND_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: OPERATOR_NAME
        sync: false
      - key: CONTACT_EMAIL
        sync: false
