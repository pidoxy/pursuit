# fly launch --copy-config --no-deploy && fly volumes create pursuit_data --size 1 && fly deploy
app = "pursuit"
primary_region = "lhr"

[build]

[env]
  DATA_DIR = "/data"
  PORT = "3000"

[[mounts]]
  source = "pursuit_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"   # keep the in-process Gmail sync + brief scheduler running
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
